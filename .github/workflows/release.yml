name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-installer:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/install_test.sh

  build:
    name: linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          # modernc.org/sqlite is pure Go, so the release binary does not link libsqlite.
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/music-server-linux-${GOARCH}" ./cmd/server
          sha256sum "dist/music-server-linux-${GOARCH}" > "dist/music-server-linux-${GOARCH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: music-server-linux-${{ matrix.goarch }}
          path: dist/*

  release:
    name: GitHub release
    needs: [build, test-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh uninstall.sh deploy/music-server.service deploy/music-server.conf dist/
          cd dist
          files=(
            music-server-linux-amd64
            music-server-linux-amd64.sha256
            music-server-linux-arm64
            music-server-linux-arm64.sha256
            music-server.service
            music-server.conf
            install.sh
            uninstall.sh
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "${files[@]}"
          fi
